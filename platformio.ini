; ===================================================
; mech_bot — PlatformIO project
;
; Three independent build environments — flash each
; board separately from the same project:
;
;   pio run -e master  -t upload   (master T-Display S3)
;   pio run -e slave   -t upload   (slave  T-Display S3)
;   pio run -e motion  -t upload   (MOTION 2350 Pro)
;
; Panel variants (debug / phone control):
;   pio run -e master_panel -t upload
;   pio run -e slave_panel  -t upload
;   pio run -e motion_panel -t upload
; ===================================================

[platformio]
description = mech_bot — 3-board robot (master + slave ESP32-S3, MOTION RP2350)

; ── MAC addresses shared across all ESP32-S3 envs ──────────────────────
[mac]
master = {0x30, 0x30, 0xF9, 0x59, 0x31, 0x78}
slave  = {0x30, 0x30, 0xF9, 0x59, 0xCE, 0xE4}

; ── Base settings — T-Display S3 (ESP32-S3) ────────────────────────────
[env:_ttgo_base]
platform = espressif32
board = esp32s3box
framework = arduino
monitor_speed = 115200
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  Wire
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -DMASTER_MAC="${mac.master}"
  -DSLAVE_MAC="${mac.slave}"

; ── Base settings — MOTION 2350 Pro (RP2350) ───────────────────────────
[env:_motion_base]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit NeoPixel@^1.12.3
  madhephaestus/ESP32Servo@^3.0.5

; ── Production envs ────────────────────────────────────────────────────

[env:master]
extends = env:_ttgo_base
src_dir = Code/LilyGo T-Display s3/master_controller_v2
build_flags =
  ${env:_ttgo_base.build_flags}
  -DBOARD_MASTER

[env:slave]
extends = env:_ttgo_base
src_dir = Code/LilyGo T-Display s3/slave_controller_v2
build_flags =
  ${env:_ttgo_base.build_flags}
  -DBOARD_SLAVE

[env:motion]
extends = env:_motion_base
src_dir = Code/Motion 2350 Pro_code/motion_controller_v2

; ── Debug / phone panel envs ───────────────────────────────────────────

[env:master_panel]
extends = env:_ttgo_base
src_dir = Code/LilyGo T-Display s3/master_control_panel_v2
build_flags =
  ${env:_ttgo_base.build_flags}
  -DBOARD_MASTER_PANEL

[env:slave_panel]
extends = env:_ttgo_base
src_dir = Code/LilyGo T-Display s3/slave_control_panel
build_flags =
  ${env:_ttgo_base.build_flags}
  -DBOARD_SLAVE_PANEL

[env:motion_panel]
extends = env:_motion_base
src_dir = Code/Motion 2350 Pro_code/motion_control_panel
